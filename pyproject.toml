[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kakapo"
version = "0.1.0.dev0"
description = "Spectrum matching tool for mass spectrometry data analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Daria Tupikina", email = "dratupi@gmail.com"}
]
keywords = ["mass spectrometry", "spectrum matching", "fragmentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "PyYAML>=6.0",
    "nerpa-ms @ file:///home/daria/Uni/Master/nerpa-ms",
    "matchms>=0.24.0",
    "numpy>=1.20.0",
    "tabulate",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "black>=23.0",
]

[project.scripts]
kakapo = "kakapo.cli:main"

[tool.setuptools]
packages = ["kakapo"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
kakapo = [
    "constants/**/*.mol",
    "constants/**/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"
lint.select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
lint.ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["kakapo"]

[tool.black]
line-length = 100
target-version = ["py39"]
